name: Validate LAHEMS2
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-test.txt
      - run: python -c "import homeassistant; import pytest; raise SystemExit(pytest.main())"
      - name: Upload the tested integration
        uses: actions/upload-artifact@v7
        with:
          name: lahems2-test-install
          path: |
            custom_components/lahems2/
            README.md
            docs/shadow-mode-card.yaml
            docs/energy-planning-roadmap.md
            docs/v2g-liberty-schedule.md
            docs/v2g-liberty-v0.9.0-schedule-export.patch
            !custom_components/**/__pycache__/**
          if-no-files-found: error

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master

  hacs:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          comment: false
